name: Library checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fields:
    name: Required symbol fields
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_symbol_fields.py symbols
      - name: Symbol pins (no combined pins; pins match footprint pads)
        run: python3 scripts/check_pin_pad_match.py symbols footprints
      - name: Symbol text (no overprinting, handbook D-47)
        run: python3 scripts/check_symbol_text.py symbols
      - name: Self-test the symbol text check
        shell: bash
        run: |
          python3 scripts/check_symbol_text.py tests/symbol_text/DropOut_TextTest.kicad_sym > "$RUNNER_TEMP/text.txt" && { echo "::error title=Symbol text self-test::fixtures should fail"; exit 1; }
          grep '^OVERPRINT ' "$RUNNER_TEMP/text.txt" | LC_ALL=C sort > "$RUNNER_TEMP/got.txt"
          diff -u tests/symbol_text/expected.txt "$RUNNER_TEMP/got.txt"

  klc:
    name: KLC (with DropOut exceptions)
    runs-on: ubuntu-latest
    env:
      KLT_REF: a903a695bf4e69905e9e56548f44dd46cdc1130e   # kicad-library-tools main @ 2026-10-21; keep in sync with scripts/klc_check.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch kicad-library-tools
        shell: bash
        run: |
          fail() { echo "::error title=KLC setup::$1"; exit 1; }
          out=$(git clone --quiet --depth 50 https://gitlab.com/kicad/libraries/kicad-library-tools.git "$RUNNER_TEMP/klt" 2>&1) || fail "clone failed: ${out//$'\n'/ | }"
          if [ -n "$KLT_REF" ]; then
            out=$(git -C "$RUNNER_TEMP/klt" checkout --quiet "$KLT_REF" 2>&1) || fail "checkout $KLT_REF failed: ${out//$'\n'/ | }"
          fi
          echo "::notice title=KLC tools::kicad-library-tools at $(git -C "$RUNNER_TEMP/klt" rev-parse HEAD) ($(git -C "$RUNNER_TEMP/klt" rev-parse --abbrev-ref HEAD))"
          echo "::notice title=KLC checkers::$(cd "$RUNNER_TEMP/klt" && find . -name 'check_symbol.py' -o -name 'check_footprint.py' | tr '\n' ' ')"
          pip install --quiet pyyaml || fail "pip install pyyaml failed"
          req=$(cd "$RUNNER_TEMP/klt" && find . -maxdepth 3 -name requirements.txt | head -1)
          if [ -n "$req" ]; then
            out=$(pip install --quiet -r "$RUNNER_TEMP/klt/$req" 2>&1) || echo "::warning title=KLC setup::requirements install had problems: ${out//$'\n'/ | }"
          fi
      - name: Self-test the KLC wrapper and exceptions
        shell: bash
        env:
          KICAD_LIBRARY_TOOLS: ${{ runner.temp }}/klt
        run: |
          set +e
          python3 scripts/klc_check.py tests/klc/DropOut_Test.pretty tests/klc/DropOut_TestSym.kicad_sym > "$RUNNER_TEMP/selftest.txt"
          grep -E '^(FAIL|WARN|WAIVED) ' "$RUNNER_TEMP/selftest.txt" | awk '{print $1, $2, $3}' | LC_ALL=C sort > "$RUNNER_TEMP/got.txt"
          if ! diff -u tests/klc/expected.txt "$RUNNER_TEMP/got.txt" > "$RUNNER_TEMP/diff.txt"; then
            echo "::error title=KLC self-test::wrapper results changed:%0A$(sed 's/%/%25/g' "$RUNNER_TEMP/diff.txt" | awk 'BEGIN{ORS="%0A"}{print}')"
            exit 1
          fi
      - name: Run KLC checks
        env:
          KICAD_LIBRARY_TOOLS: ${{ runner.temp }}/klt
        run: python3 scripts/klc_check.py

  parse:
    name: KiCad 10 can load every library
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root   # default image user can't write the Actions workspace
    steps:
      - uses: actions/checkout@v4
      - name: Export every symbol library to SVG (fails on parse errors)
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p /tmp/out
          for lib in symbols/*.kicad_sym; do
            echo "::group::$lib"
            kicad-cli sym export svg --output /tmp/out "$lib"
            echo "::endgroup::"
          done
      - name: Export every footprint library to SVG (fails on parse errors)
        shell: bash
        run: |
          shopt -s nullglob
          for lib in footprints/*.pretty; do
            echo "::group::$lib"
            kicad-cli fp export svg --output /tmp/out "$lib"
            echo "::endgroup::"
          done

  notify-catalog:
    name: Ask the catalog to rebuild
    needs: [fields, klc, parse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch library-updated to dropout-library-catalog
        env:
          GH_TOKEN: ${{ secrets.CATALOG_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice title=Catalog::CATALOG_DISPATCH_TOKEN not set; the catalog's nightly build will pick this up"
            exit 0
          fi
          gh api repos/karlTbowers/dropout-library-catalog/dispatches \
            -f event_type=library-updated -f "client_payload[sha]=$GITHUB_SHA"
          echo "::notice title=Catalog::rebuild requested for $GITHUB_SHA"
