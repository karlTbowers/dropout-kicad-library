name: Library checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fields:
    name: Required symbol fields
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_symbol_fields.py symbols

  klc:
    name: KLC (with DropOut exceptions)
    runs-on: ubuntu-latest
    env:
      KLT_REF: master   # keep in sync with KLT_REF in scripts/klc_check.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch kicad-library-tools
        run: |
          git clone --quiet https://gitlab.com/kicad/libraries/kicad-library-tools.git "$RUNNER_TEMP/klt"
          git -C "$RUNNER_TEMP/klt" checkout --quiet "$KLT_REF"
          pip install pyyaml
          if [ -f "$RUNNER_TEMP/klt/requirements.txt" ]; then pip install -r "$RUNNER_TEMP/klt/requirements.txt"; fi
      - name: Run KLC checks
        env:
          KICAD_LIBRARY_TOOLS: ${{ runner.temp }}/klt
        run: python3 scripts/klc_check.py

  parse:
    name: KiCad 10 can load every library
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root   # default image user can't write the Actions workspace
    steps:
      - uses: actions/checkout@v4
      - name: Export every symbol library to SVG (fails on parse errors)
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p /tmp/out
          for lib in symbols/*.kicad_sym; do
            echo "::group::$lib"
            kicad-cli sym export svg --output /tmp/out "$lib"
            echo "::endgroup::"
          done
      - name: Export every footprint library to SVG (fails on parse errors)
        shell: bash
        run: |
          shopt -s nullglob
          for lib in footprints/*.pretty; do
            echo "::group::$lib"
            kicad-cli fp export svg --output /tmp/out "$lib"
            echo "::endgroup::"
          done
