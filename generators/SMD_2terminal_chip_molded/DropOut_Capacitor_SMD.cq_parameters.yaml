# 3D models for DropOut_Capacitor_SMD.yaml, generated by kicad-library-tools' capacitor/SMD model
# generator (merged into its stock cq_parameters.yaml by scripts/generate_footprint.py).
# Nominal length and width; height is the tallest part built on the footprint (max thickness).
model_generator: capacitor/SMD

C_0402_1005Metric:
  modelName: 'C_0402_1005Metric'
  model_class: 'c_chip_smd'
  length: 1.0
  width: 0.5
  height: 0.55   # Murata GCM155 T 0.5+/-0.05, TDK CGA2B 0.55 max
  pin_band: 0.25
  pin_thickness: 'auto'
  edge_fillet: 'auto'
  rotation: 0
  body_color_key: 'brown body'
  pins_color_key: 'metal grey pins'
  destination_dir : 'DropOut_Capacitor_SMD.3dshapes'
  source: 'DropOut_Capacitor_SMD.yaml datasheets'

