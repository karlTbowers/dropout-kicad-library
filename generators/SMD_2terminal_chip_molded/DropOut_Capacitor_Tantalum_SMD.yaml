# Polymer tantalum chip sizes for DropOut_Capacitor_SMD, in kicad-library-tools' SMD_2terminal_chip_molded
# format (generator part_definitions in DropOut_Capacitor_Tantalum_SMD.part_definitions.yaml).
# Generate: ~/.cache/dropout/klt-venv/bin/python scripts/generate_footprint.py \
#     generators/SMD_2terminal_chip_molded/DropOut_Capacitor_Tantalum_SMD.yaml --lib DropOut_Capacitor_SMD
#
# IPC-7352 nominal land, as KiCad's stock CP_EIA-* footprints. The PR compares it with KEMET's
# Table 2 (median land).
C_7343-43:
    code_metric: '7343-43'
    code_letter: 'Kemet-X'
    # KEMET T59X automotive polymer (T2073_T59X, 2025-11-05) case X: L 7.3 +/- 0.3, W 4.3 +/- 0.3,
    # H 4.0 +/- 0.3, terminal width F 2.4 +/- 0.1, terminal length S 1.3 +/- 0.3 (same as KiCad stock)
    body_length:
        nominal: 7.3
        tolerance: 0.3
    body_width:
        nominal: 4.3
        tolerance: 0.3
    terminal_length:
        nominal: 1.3
        tolerance: 0.3
    terminal_width:
        nominal: 2.4
        tolerance: 0.1
    size_info: '(Body size from: KEMET T2073_T59X, https://yageogroup.com/content/datasheet/asset/file/KEM_T2073_T59X)'
