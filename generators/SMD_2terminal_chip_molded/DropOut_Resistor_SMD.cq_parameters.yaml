# 3D models for DropOut_Resistor_SMD.yaml, generated by kicad-library-tools' resistor/SMD model
# generator (merged into its stock cq_parameters.yaml by scripts/generate_footprint.py).
# Nominal body sizes; height is the tallest part built on the footprint.
model_generator: resistor/SMD

R_0402_1005Metric:
  length: 1.0
  width: 0.5
  height: 0.4   # Panasonic ERJ-2G/2R T 0.35+/-0.05 (Yageo AC0402 0.32+/-0.05)
  pin_band: 0.25
  pin_thickness: 'auto'
  edge_fillet: 'auto'
  rotation: 0
  source: 'Yageo AC and Panasonic ERJ-2G/2R datasheets'

R_0603_1608Metric:
  length: 1.6
  width: 0.8
  height: 0.55  # Yageo AC0603 0.45+/-0.10, Panasonic ERJ-3E/ERA-3A 0.45+/-0.10
  pin_band: 0.3
  pin_thickness: 'auto'
  edge_fillet: 'auto'
  rotation: 0
  source: 'Yageo AC, Panasonic ERJ-3E/ERA-3A, Vishay CRCW/TNPW datasheets'
