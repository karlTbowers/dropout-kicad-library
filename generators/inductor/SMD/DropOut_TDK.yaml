  PartNumber: SPM4020-DZ
  datasheet: "https://product.tdk.com/system/files/dam/doc/product/inductor/inductor/smd/catalog/inductor_automotive_power_spm4020-dz_en.pdf"
  widthX: 4.3
  lengthY: 4.1
  height: 2.0
  padX: 0.8
  padY: 2.0
  landingInsideX: 2.4
  landingOutsideX: 5.4
  landingY: 2.3
