# TDK SPM-DZ automotive metal composite power inductors (DropOut spec for kicad-library-tools
# data/inductor/SMD/).
default_parameters:
  manufacturer: TDK
  library_name: DropOut_Inductor_SMD
  3d:
    type: 2
    bodyColor: black body
    pinColor: metal grey pins
    padThickness: 0.05
