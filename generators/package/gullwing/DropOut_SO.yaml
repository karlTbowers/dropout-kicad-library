# DropOut footprint specs for the kicad-library-tools gullwing generator (SOIC, SSOP, TSSOP...).
# Generate with: scripts/generate_footprint.py generators/package/gullwing/DropOut_SO.yaml --lib DropOut_Package_SO
# Source documents are archived in the private dropout-vendor-docs repo.

default_parameters:
  device_type: 'SOIC'
  library_Suffix: 'SO'

# IS25LP032D-JNLA3 ("N" package). ISSI gives no land pattern, so the land pattern is IPC-7351
# from the outline, as KiCad's stock footprint of the same name; the outline (ISSI IS25LP032D
# datasheet Rev. A16 §10.2) is identical to JEDEC MS-012AA.
SOIC-8_3.9x4.9mm_P1.27mm:
  size_source: 'ISSI IS25LP032D/IS25WP032D datasheet Rev. A16, 10.2 8-pin JEDEC 150mil SOIC (N), JEDEC MS-012AA, https://www.issi.com/WW/pdf/25LP-WP032D.pdf#page=110'
  device_type: 'SOIC'
  body_size_x:
    nominal: 3.9
    tolerance: 0.1      # E1 3.80..4.00
  body_size_y:
    minimum: 4.8        # D
    maximum: 5.0
  body_height: 1.35 .. 1.75   # A max 1.75
  body_pcb_gap: 0.10 .. 0.25  # A1
  overall_size_x:
    nominal: 6
    tolerance: 0.2      # E 5.80..6.20
  lead_width:
    minimum: 0.31       # b
    maximum: 0.51
  lead_len:
    minimum: 0.4        # L
    maximum: 1.27
  lead_height: 0.17 .. 0.25
  pitch: 1.27
  num_pins_x: 0
  num_pins_y: 4

# INA228AQDGSRQ1. Outline and land pattern: TI DGS0010A (4221984/A), INA228-Q1 datasheet
# SLYS022A pages 47-48 (JEDEC MO-187 BA). Land pattern: 10x 1.45 x 0.30 pads, rows 4.4 apart
# -> pad-to-pad 2.95 inside, 5.85 outside (same as KiCad's stock Texas_DGS0020A).
Texas_DGS0010A_TSSOP-10_3x3mm_P0.5mm:
  size_source: 'https://www.ti.com/lit/ds/symlink/ina228-q1.pdf#page=47'
  manufacturer: 'Texas'
  part_number: 'DGS0010A'
  device_type: 'TSSOP'
  body_size_x:
    minimum: 2.90       # E1
    maximum: 3.10
  body_size_y:
    minimum: 2.90       # D
    maximum: 3.10
  body_height: 0.75 .. 0.95
  body_pcb_gap: 0.05 .. 0.15
  overall_size_x:
    minimum: 4.75       # E
    maximum: 5.05
  lead_width:
    minimum: 0.17
    maximum: 0.27
  lead_len:
    minimum: 0.40
    maximum: 0.70
  lead_height: 0.13 .. 0.23
  pitch: 0.50
  num_pins_x: 0
  num_pins_y: 5
  pad_to_pad_min_x_overwrite: 2.95
  pad_to_pad_max_x_overwrite: 5.85
  pad_size_y_overwrite: 0.30
