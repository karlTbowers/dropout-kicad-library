# DropOut footprint specs for the kicad-library-tools gullwing generator (SOT/TSOT packages).
# Generate with: scripts/generate_footprint.py generators/package/gullwing/DropOut_SOT.yaml --lib DropOut_Package_TO_SOT_SMD
# Source documents are archived in the private dropout-vendor-docs repo.

default_parameters:
  device_type: 'TSOT'
  library_Suffix: 'TO_SOT_SMD'

# TPS3702AX33QDDCRQ1 / TPS3702CX33QDDCRQ1. TI DDC0006A (4214841/E 08/2024), TPS3702-Q1 datasheet
# SBVS261C pages 26-28 (JEDEC MO-193). Land pattern: 6X (1.1) x (0.6), pitch 0.95, rows (2.7) apart
# -> pad-to-pad 1.6 inside, 3.8 outside. Body values as KiCad's TSOT-23-6 (MO-193 AA), which agree
# with DDC0006A within tolerance (E1 1.45..1.75, D 2.75..3.05, E 2.55..3.05, A 1.1 max).
Texas_DDC0006A_TSOT-23-6:
  size_source: 'https://www.ti.com/lit/ds/symlink/tps3702-q1.pdf#page=26'
  custom_name_format: 'Texas_DDC0006A_TSOT-23-6'
  body_size_x: 1.6
  body_size_y: 2.9
  body_height: 0.7 .. 0.9 .. 1.0
  body_pcb_gap: 0.0 .. 0.1
  overall_size_x: 2.8
  lead_width: 0.3 .. 0.5
  lead_len: 0.3 .. 0.45 .. 0.6
  lead_height: 0.12 .. 0.20
  lead_radius_top: 0.1
  lead_radius_bottom: 0.175
  pitch: 0.95
  num_pins_x: 0
  num_pins_y: 3
  pad_to_pad_min_x_overwrite: 1.6
  pad_to_pad_max_x_overwrite: 3.8
  pad_size_y_overwrite: 0.6

# NCV8730ASN330T1G. onsemi TSOP-5 3.00x1.50x0.95, 0.95P, CASE 483 issue P (98ARB18753C, 01 APR 2024),
# NCV8730 datasheet Rev. 8 page 31. Pins 1-3 on one side, 4-5 on the other (the middle position
# is empty; note 5 allows a trimmed stub there that never reaches the board). Recommended
# mounting footprint: 0.70 x 1.00 pads, pitch 0.95, rows 2.40 apart -> 1.40 inside, 3.40 outside.
OnSemi_483_TSOP-5_1.5x3mm_P0.95mm:
  size_source: 'https://www.onsemi.com/download/data-sheet/pdf/ncv8730-d.pdf#page=31'
  custom_name_format: 'OnSemi_483_TSOP-5_1.5x3mm_P0.95mm'
  device_type: 'TSOP'
  body_size_x: 1.35 .. 1.50 .. 1.65    # E1
  body_size_y: 2.85 .. 3.00 .. 3.15    # D
  body_height: 0.80 .. 0.95 .. 1.00    # A 0.90..1.10 minus A1 0.01..0.10
  body_pcb_gap: 0.01 .. 0.10
  overall_size_x: 2.50 .. 2.75 .. 3.00 # E
  lead_width: 0.25 .. 0.375 .. 0.50
  lead_len: 0.20 .. 0.40 .. 0.60
  lead_height: 0.10 .. 0.18 .. 0.26
  lead_radius_top: 0.1
  lead_radius_bottom: 0.175
  pitch: 0.95
  num_pins_x: 0
  num_pins_y: 3
  deleted_pins: [5]
  pad_to_pad_min_x_overwrite: 1.4
  pad_to_pad_max_x_overwrite: 3.4
  pad_size_y_overwrite: 0.7

# MPQ2143DJ-AEC1-LF-Z. MPS TSOT23-8 (JEDEC MO-193 BA), MPQ2143 datasheet Rev. 1.02 (10/15/2024) p. 15 "Package
# Information": body 2.80..3.00 x 1.50..1.70, span 2.60..3.00, A 1.00 max, A2 0.70..0.90, A1 0.00..0.10, b 0.20..0.40,
# c 0.09..0.20, L 0.30..0.50, pitch 0.65; pin 1 lower left when the top mark reads left to right. Recommended land
# pattern: 0.30 x 1.20 TYP pads, 0.65 pitch, rows 2.60 TYP apart -> pad-to-pad 1.40 inside, 3.80 outside.
MPS_TSOT-23-8:
  size_source: 'https://www.monolithicpower.com/en/documentview/productdocument/index/version/2/document_type/Datasheet/lang/en/sku/MPQ2143/document_id/996'
  custom_name_format: 'MPS_TSOT-23-8'
  body_size_x: 1.50 .. 1.60 .. 1.70     # E1
  body_size_y: 2.80 .. 2.90 .. 3.00     # D
  body_height: 0.70 .. 0.80 .. 0.90     # A2
  body_pcb_gap: 0.0 .. 0.05 .. 0.10     # A1
  overall_size_x: 2.60 .. 2.80 .. 3.00  # E
  lead_width: 0.20 .. 0.30 .. 0.40      # b
  lead_len: 0.30 .. 0.40 .. 0.50        # L
  lead_height: 0.09 .. 0.145 .. 0.20    # c
  lead_radius_top: 0.1
  lead_radius_bottom: 0.15
  pitch: 0.65
  num_pins_x: 0
  num_pins_y: 4
  pad_to_pad_min_x_overwrite: 1.4
  pad_to_pad_max_x_overwrite: 3.8
  pad_size_y_overwrite: 0.3
