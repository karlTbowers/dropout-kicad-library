# DropOut footprint specs for the kicad-library-tools no_lead generator (onsemi packages).
# Generate with: scripts/generate_footprint.py generators/package/no_lead/DropOut_OnSemi.yaml --lib DropOut_Package_DFN_QFN
# Source documents are archived in the private dropout-vendor-docs repo.

default_parameters:
  library: Package_DFN_QFN

# NCV8730BMTW330TBG. onsemi WDFNW6 2x2, 0.65P, CASE 511DW issue B (98AON79327G, 15 JUN 2018),
# NCV8730 datasheet Rev. 8 page 32, with wettable flanks (note 5). The drawing has the pin rows
# along the top and bottom edges; turned 90 degrees here so pins 1-3 run down the left side, as
# the datasheet's pin assignment figure. Recommended mounting footprint: 6X 0.35 x 0.48 pads,
# pitch 0.65, 2.30 outer span (pad centres 1.82 apart); exposed pad 0.95 x 1.65 (package EP
# E2 0.80..1.00 x D2 1.50..1.70). No stencil given: EP paste uses the generator's default split.
OnSemi_511DW_WDFNW-6-1EP_2x2mm_P0.65mm_EP0.95x1.65mm:
  size_source:
    url: 'https://www.onsemi.com/download/data-sheet/pdf/ncv8730-d.pdf'
    page: 32
  device_type: 'WDFNW'
  manufacturer: 'OnSemi'
  part_number: '511DW'
  ipc_class: 'qfn_pull_back'
  body_size_x:
    minimum: 1.9
    maximum: 2.1
  body_size_y:
    minimum: 1.9
    maximum: 2.1
  body_pcb_gap: 0.0 .. 0.05
  overall_height:
    minimum: 0.70
    maximum: 0.80
  num_pins_x: 0
  num_pins_y: 3
  pitch: 0.65
  lead_shape: square
  lead_width:
    minimum: 0.25
    maximum: 0.35
  lead_len:
    minimum: 0.25
    maximum: 0.35
  lead_height:
    nominal: 0.2
  EP_size_x:
    minimum: 0.80
    maximum: 1.00
  EP_size_y:
    minimum: 1.50
    maximum: 1.70
  EP_size_x_overwrite: 0.95
  EP_size_y_overwrite: 1.65
  EP_num_paste_pads: [1, 2]
  pad_length: 0.48
  pad_width: 0.35
  pad_center_to_center_x: 1.82
