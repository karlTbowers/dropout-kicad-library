# DropOut footprint specs for the kicad-library-tools no_lead generator (TI packages).
# Generate with: scripts/generate_footprint.py generators/package/no_lead/DropOut_Texas.yaml --lib DropOut_Package_DFN_QFN
# Source documents are archived in the private dropout-vendor-docs repo.

default_parameters:
  library: Package_DFN_QFN

# LM74910HQRGERQ1. TI RGE0024T (4228214/A 11/2021), LM749x0-Q1 datasheet SNOSDE6C pages 48-50.
# Land pattern: 24X (0.6) x (0.25), pitch 0.5, rows (3.8) apart; thermal pad 25 (2.1 square);
# stencil 4X (0.94) squares at (0.57), i.e. 4 x 0.94^2 / 2.1^2 = 0.80 paste coverage. The generator
# centres the squares at 0.525 (gap 0.11) instead of TI's reference (0.57): same size and area.
Texas_RGE0024T_VQFN-24-1EP_4x4mm_P0.5mm_EP2.1x2.1mm:
  size_source:
    url: 'https://www.ti.com/lit/ds/symlink/lm74910h-q1.pdf'
    page: 48
  device_type: 'VQFN'
  manufacturer: 'Texas'
  part_number: 'RGE0024T'
  ipc_class: 'qfn'
  body_size_x:
    minimum: 3.9
    maximum: 4.1
  body_size_y:
    minimum: 3.9
    maximum: 4.1
  body_pcb_gap: 0.0 .. 0.05
  overall_height:
    minimum: 0.8
    maximum: 1.0
  num_pins_x: 6
  num_pins_y: 6
  pitch: 0.5
  lead_shape: square
  lead_width:
    minimum: 0.2
    maximum: 0.3
  lead_len:
    minimum: 0.3
    maximum: 0.5
  lead_height:
    nominal: 0.2
  EP_size_x:
    nominal: 2.1
    tolerance: 0.1
  EP_size_y:
    nominal: 2.1
    tolerance: 0.1
  EP_paste_coverage: 0.80
  EP_num_paste_pads: [2, 2]
  pad_length: 0.6
  pad_width: 0.25
  pad_center_to_center_x: 3.8
  pad_center_to_center_y: 3.8

# TPS7B8133QWDRVRQ1 (wettable flank) / TPS7B8133QDRVRQ1. TI DRV0006A (4222173/C 11/2025), TPS7B81-Q1
# datasheet SBVS370F pages 27-29; one drawing for both versions (the wettable flank is an optional
# side-wall detail, note 4). Land pattern: 6X (0.45) x (0.3), pitch 0.65, rows (1.95) apart;
# thermal pad 7 (1) x (1.6). Stencil: two (1) x (0.7) apertures at +/-(0.45), 88 % coverage.
# Optional 0.2 mm vias at +/-0.55 are left to the board.
Texas_DRV0006A_WSON-6-1EP_2x2mm_P0.65mm_EP1x1.6mm:
  size_source:
    url: 'https://www.ti.com/lit/ds/symlink/tps7b81-q1.pdf'
    page: 27
  device_type: 'WSON'
  manufacturer: 'Texas'
  part_number: 'DRV0006A'
  ipc_class: 'qfn_pull_back'
  body_size_x:
    minimum: 1.9
    maximum: 2.1
  body_size_y:
    minimum: 1.9
    maximum: 2.1
  body_pcb_gap: 0.0 .. 0.05
  overall_height:
    minimum: 0.7
    maximum: 0.8
  num_pins_x: 0
  num_pins_y: 3
  pitch: 0.65
  lead_shape: square
  lead_width:
    minimum: 0.2
    maximum: 0.3
  lead_len:
    minimum: 0.25
    maximum: 0.35
  lead_height:
    nominal: 0.2
  EP_size_x:
    nominal: 1.0
    tolerance: 0.1
  EP_size_y:
    nominal: 1.6
    tolerance: 0.1
  EP_num_paste_pads: [1, 2]
  EP_paste_coverage: 0.88
  pad_length: 0.45
  pad_width: 0.3
  pad_center_to_center_x: 1.95
