# DropOut deviations from the KiCad Library Conventions (https://klc.kicad.org/).
#
# DropOut follows KLC everywhere EXCEPT the entries below. scripts/klc_check.py
# suppresses exactly these violations and fails on everything else.
#
# To add an exception: open a PR that adds ONE entry here with a clear reason.
# Never add an exception just to make a single part pass; fix the part instead.
#
# Fields:
#   id        short unique slug
#   rules     KLC rule IDs this covers (e.g. F9.3). A rule ID like "F9" covers all F9.x.
#   applies   glob(s) matched against "<Library>:<Item>" (e.g. "DropOut_Power:*", "*").
#   match     optional regex; if set, EVERY detail line of the violation must match it,
#             so a violation that also reports some other problem is not waived.
#   reason    why DropOut deviates
#   approved  date approved (YYYY-MM-DD)

exceptions:
  - id: model-path-kiprjmod
    rules: [F9.3]
    applies: ["*"]
    # Waives only: the path-prefix message, the "directory is different" message when our
    # path ends in exactly the expected <Lib>.3dshapes folder, and the informational path line.
    # A wrong .3dshapes folder, wrong file name, scale, offset or rotation still fails.
    match: >-
      ^Model path should start with '\$\{KICAD\d+_3DMODEL_DIR\}/'$|^3D model directory is different from footprint directory \(found '\$\{KIPRJMOD\}/lib/dropout-kicad-library/3dmodels/([^']+)', should be '\1'\)$|^- 3D model path: \$\{KIPRJMOD\}/lib/dropout-kicad-library/3dmodels/[^/]+\.3dshapes/[^/]+\.step$
    reason: >
      KLC requires the ${KICAD10_3DMODEL_DIR}/ prefix, which points at KiCad's stock
      model folder. DropOut models live in this repo, mounted in every project as a
      submodule, so footprints use ${KIPRJMOD}/lib/dropout-kicad-library/3dmodels/...
      This keeps 3D models pinned per board revision. All other F9.3 requirements
      (STEP, 1:1:1 scale, zero offset/rotation, .3dshapes folder named after the
      footprint library, model named after the footprint) still apply.
    approved: 2026-10-21

  - id: dropout-library-prefix
    rules: [G1.3, S1.1, F1.1]
    applies: ["*"]
    match: "(?i)librar(y|ies)"
    reason: >
      Libraries are named DropOut_<Category> instead of function-only names so they
      never collide with KiCad's stock libraries in a user's library tables. The
      <Category> part still follows KLC functional naming and capitalization.
    approved: 2026-10-21

  - id: dropout-symbol-fields
    rules: [S6.2]
    applies: ["*"]
    # Waives only "unexpected property" warnings for DropOut's own fields. Any other S6.2
    # finding (missing or empty KLC fields, bad keywords, etc.) is still reported.
    match: >-
      ^Found a unexpected property with the name (Manufacturer|MPN|DigiKey_PN|Mouser_PN|Temperature_Grade|Notes|Reference_Manual)$
    reason: >
      Every DropOut symbol is an atomic, orderable part, so it carries Manufacturer, MPN,
      DigiKey_PN and Mouser_PN (required, enforced by scripts/check_symbol_fields.py) and
      may carry Temperature_Grade, Notes and Reference_Manual (optional; see
      docs/CONTRIBUTING.md). KLC's stock symbols are generic and define no such fields,
      so the checker flags them under S6.2. All KLC-required S6.2 fields are still checked.
    approved: 2026-10-22

  - id: visible-nc-pins
    rules: [S4.6]
    applies: ["*"]
    # Waives only the "NC pins are VISIBLE (should be INVISIBLE)" warning and its per-pin lines.
    # An NC pin of the wrong type, or a hidden power_in pin, still fails.
    match: >-
      ^NC pins are VISIBLE \(should be INVISIBLE\):$|^- Pin .+ \(\S+\) @ \(-?\d+,-?\d+\) should be INVISIBLE$
    reason: >
      DropOut draws every package pin as its own visible pin (docs/CONTRIBUTING.md, "Every pin
      is its own pin"), including no-connect pins, so a schematic shows every pin of the part and
      ERC flags a wire to an NC pin. KLC S4.6 prefers NC pins hidden. NC pins must still be of
      type no_connect.
    approved: 2026-10-22
