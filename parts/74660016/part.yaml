# Würth 74660016 data sheet rev. 001.001 (2022-02-10): WP-SMRT REDCUBE SMT, reverse with internal thread, M6 through
# thread, Ø12.0 flange 3.0 high, Ø9.0 spigot 2.6 into a Ø9.3 non-plated hole, brass, tin, 85 A (operating current depends
# on PCB, cable lug and cable), 3.9 N·m tightening torque, -55 to +150 °C, MSL 1, packaging bulk. 74660016R is the same part on tape and reel.
# One electrical terminal: one pad and one symbol pin, numbered 1. Archived in dropout-vendor-docs Wuerth/REDCUBE/.
# Footprint from the data sheet's land pattern and stencil (generators/custom/Wuerth_REDCUBE_SMT.py), copper ring pulled back 0.25 from the hole (Ø9.8, user's decision 2026-10-26). Würth's official
# KiCad library (commit c905610) has the same paste but no Ø9.3 hole; we follow the data sheet.
# 3D model: Würth's own STEP from that library (REDCUBE_SMD_Wurth.3dshapes), marked as modified by DropOut and crediting
# WE eiSos per Würth's license.
# Observed 2026-10-26: not orderable at DigiKey, Mouser (listed without a Mouser PN) or Newark.
