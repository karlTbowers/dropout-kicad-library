# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/ABM10AIG-16.000MHZ-4Z-T/part.yaml
# Abracon ABM10AIG automotive crystal (datasheet rev. 06-14-19). Ordering code decoded with
# "Options and Part Identification" (p. 2): 16.000MHZ; load capacitance blank = 10 pF;
# operating temperature blank = -40 to +125 °C; 4 = ±30 ppm tolerance; Z = ±50 ppm stability;
# T = 1k pcs / reel. The -T3 code is the S32K344 FXOSC crystal (Y1) on NXP's MR-CANHUBK344;
# -T3 and -T differ only in reel size and share pins and footprint.
# Pins (p. 3): #1, #3 crystal; #2, #4 GND, connected to the lid. Lid pins are passive "G" as
# KiCad's Device:Crystal_GND24, drawn as two separate visible pins (DropOut never combines pins).
library: DropOut_Timing
name: ABM10AIG-16.000MHZ-4Z-T
style: crystal_gnd24
pins: pins.csv
fields:
  Reference: Y
  Value: ABM10AIG-16.000MHZ-4Z-T
  Footprint: DropOut_Crystal:Crystal_SMD_Abracon_ABM10AIG-4Pin_2.5x2.0mm
  Datasheet: https://abracon.com/AIGcrystals/ABM10AIG.pdf
  Description: Abracon ABM10AIG 16 MHz crystal, fundamental, CL 10 pF, ±30 ppm at 25 °C, ±50 ppm over temperature, ESR 80 Ω max, -40 to +125 °C, AEC-Q200, 2.5x2.0 mm
  ki_keywords: crystal quartz 16MHz automotive AEC-Q200
  ki_fp_filters: Crystal*Abracon*ABM10AIG*
  Manufacturer: Abracon
  MPN: ABM10AIG-16.000MHZ-4Z-T
  DigiKey_PN: 535-ABM10AIG-16.000MHZ-4Z-TTR-ND
  Mouser_PN: 815-ABM10AIG160004ZT
  Temperature_Grade: AEC-Q200, -40 to +125 °C
