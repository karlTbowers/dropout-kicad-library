# page; archived in dropout-vendor-docs Amphenol-Sine/BoardLock/.
# Node60 output connector (DEC-013 rev. B, user's decision 2026-10-25), replacing TE DT13-2P.
# Siblings on the same drawing (not built): BM01 gold/no potting, BM02 gold/potting, BM03 tin/no
# potting (Amphenol: comparable to DT13-2P).
# Observed 2026-10-25: DigiKey 889-3345-ND $5.93 @1 / $5.035 @10 / $4.106 @180 / $3.618 @1080,
