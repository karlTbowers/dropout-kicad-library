# ATM06-2S plug. Sources: drawing ATM13-2P-BMXX rev. A2 (variants table, specifications 3.1-3.7: 7.5 A,
# -55 to +125 °C, 1500 VAC withstanding, 1000 MΩ, IP67 mated, 100 mating cycles; note 6: potted versions
# for up to 5 psi), BoardLock Family Flyer (09-2026) p. 22 (250 V); PCNs 22004 (retaining sleeve now black)
# and 22012 (potting now white), cosmetic only. Archived in dropout-vendor-docs Amphenol-Sine/ATM/.
# 3D model: Amphenol Sine's own ATM13-2P-BM04 STEP (CADENAS, CC BY-ND 4.0; Amphenol Sine allowed publishing
