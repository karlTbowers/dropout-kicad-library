# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/BVR-Z-R0002-1.0/part.yaml
# Isabellenhuette BVR (4026) data sheet, issue 12-September-2024. Node60 4-terminal (Kelvin) shunt search
# (2026-10-22): no 0.25 mΩ code exists, so the stocked 0.2 and 0.3 mΩ neighbours are built for a later
# revision (user's request, 2026-10-23); using one means rescaling the LM74910H and INA228 thresholds.
# p. 1-2: 0.2 mΩ ZERANIN element, TCR 0 ±20 ppm/K (20-60 °C), Rthi 4 K/W, recommended max.
# power 12 W at 70 °C and 6 W above 100 °C terminal temperature, -65 to +170 °C, AEC-Q200.
# Ordering code (p. 1): type BVR - material Z - value R0002 - tolerance 1.0 (%); one packaging
# (24 mm tape, 1400 per 13" reel). DigiKey stock 10949 (2026-10-22); Mouser and Newark do not list it.
# Pins as KiCad's Device:R_Shunt and stock R_Shunt_Isabellenhuette_BVR4026: 1 and 4 force, 2 and 3
# sense (the narrow leads), 2 on pin 1's terminal.
library: DropOut_Resistor
