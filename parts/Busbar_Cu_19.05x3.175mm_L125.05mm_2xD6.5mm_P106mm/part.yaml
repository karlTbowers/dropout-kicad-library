# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/Busbar_Cu_19.05x3.175mm_L125.05mm_2xD6.5mm_P106mm/part.yaml
# Footprint, 3D model and drawing: generators/custom/Busbar_Cu_FlatBar.py.
#
# Node60 VBAT_IN busbar (BB901): joins the REDCUBE terminals J910 and J901 (node60-hw DEC-025, enclosure
# version 15, 2026-11-01). Until 2026-11-02 a model-only part (docs/CONTRIBUTING.md "Model-only parts");
# now a net-tie part (node60-hw placement decision D02, option A, user 2026-11-02): the board has no
# copper between J910 and J901, only this bar, so KiCad reported J901 unconnected, and a net tie between
# two pads of one net joins nothing. The schematic now puts J901 on its own net and this two-pin part
# joins it to VBAT_IN on purpose, which also gives the bar a BOM line.
#
# Cut from 1/8" x 3/4" C110 copper flat bar and drilled in house, so there is no MPN to order: as the
# other busbar and parts made in house, Manufacturer DropOut, MPN = the part name, distributor PNs "-",
# Datasheet = the drawing (docs/CONTRIBUTING.md "Parts with nothing to buy", "Model-only parts"). The
# bar IS bought and fitted, so it stays on the BOM (in_bom true); it is fitted by hand at assembly, not
# placed by machine, so it is out of the position files (here and in the footprint's attributes).
# Stock: ASTM B187 C110 bar; stocked e.g. by Metals Depot (CPF1834, 1/8" x 3/4", 3/6/12 ft) and Zoro
# (Zoro Select CF.125X.75-72, 6 ft), seen in a web search 2026-11-02. Dimensions: hole pitch 106 mm from
# the terminal positions in node60-hw scripts/place_connectors.py (v15), length = pitch + one bar width,
# holes Ø6.5 (BUSBAR_HOLE). Edge radius and deburr chamfers are estimates (see the generator).
