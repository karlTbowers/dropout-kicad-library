# catalog lists it. Model and drawing: generators/custom/Busbar_Cu_FlatBar.py.
# Node60 GND busbar (BB902): joins the REDCUBE terminals J911 and J902 (node60-hw DEC-025, enclosure
# version 15, 2026-11-01). Cut from 1/8" x 3/4" C110 copper flat bar and drilled in house, so there is
# no MPN to order: Manufacturer DropOut, MPN = the part name, distributor PNs "-", as the no-MPN
# convention (docs/CONTRIBUTING.md "Parts with nothing to buy"). Dimensions: hole pitch 157 mm from the
# terminal positions in node60-hw scripts/place_connectors.py (v15), length = pitch + one bar width,
# holes Ø6.5 (BUSBAR_HOLE). Edge radius and deburr chamfers are estimates (see the generator).
