  Description: HISENG DEUTSCH DT13-2P compatible 2-pin right-angle PCB header, 5.46 mm pitch, panel flange seal, seller rating 13 A 250 V; mates DT06-2S plug
  ki_keywords: connector header right angle DEUTSCH DT DT13 DT13-2P DT06-2S sealed automotive
  ki_fp_filters: TE*DEUTSCH?DT*DT13?2P*
  Manufacturer: Shenzhen Haisheng Hongye Technology (HISENG)
  MPN: CH-AK-DT13-02
  DigiKey_PN: '-'
  Mouser_PN: '-'
  Temperature_Grade: Not specified by a datasheet (seller claims -55 to +125 °C)
  Notes: 'Alternate to TE DT13-2P, no authorized distributor. Supplier: Alibaba, https://www.alibaba.com/product-detail/Right-Angle-DT13-2P-2-Pin_1601383533915.html (/bin/zsh.10-0.50, MOQ 100, observed 2026-10-22). No drawing or qualification data; footprint is the TE DT13-2P layout, verify a sample.'
