# Murata reference specification J(E)TE243A-9102J-01 (DFE252012P) pp. 1-4. Two-terminal inductor, no polarity (pins 1/2 = footprint pads 1/2). Symbol name and Value replace "=" with "_" (KLC G1.1/S6.2: "=" is not a legal name character; Value = name); the MPN field keeps the exact code.
# p. 2: 0.47 µH ±20 %, DCR 27 mΩ max / 21 typ, rated current 5.2 A max / 6.1 typ (inductance -30 %), 4.0 A max / 4.7 typ
