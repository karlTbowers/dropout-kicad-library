# temperature rise (40 °C max). Murata grades it for automotive infotainment/comfort equipment.
# Node60 1V5_CORE buck part search (TPS628502QDRLRQ1, 2026-11-02): NOT CHOSEN. Rated only to +125 °C including
# self-heating, so no margin for self-heating at Node60's +125 °C ambient (REQ-QUAL-001).
