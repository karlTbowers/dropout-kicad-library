  Description: Diodes DMC2710UVQ complementary N + P MOSFET pair, 20 V / -20 V, N 0.4 Ω max at VGS 4.5 V (1.1 A), P 0.7 Ω max at VGS -4.5 V (-0.8 A), ±6 V VGS, ESD-protected gates, AEC-Q101, SOT-563
  ki_keywords: MOSFET complementary N-channel P-channel pair dual transistor half bridge
  ki_fp_filters: Diodes*SOT?563*
