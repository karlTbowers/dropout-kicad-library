# DT13-4P ...", Brand Name "Jorch"), so the symbol is named DT13-2P_Jorch and MPN is the seller's model
# code. Node60 alternate to TE DT13-2P (DEC-013, user's decision 2026-10-22): no authorized
# distributor, so DigiKey_PN and Mouser_PN are "-".
# Listing https://www.aliexpress.com/i/3256804973396267.html, observed 2026-10-22 (regular price, USD):
# 1 set $5.02, 2 sets $4.75, 5 sets $26.84, 10 sets $38.32. No ratings, drawing, or material data.
# Photos (archived in dropout-vendor-docs Jorch/DT13-2P/) show the DT13-2P boss and pin arrangement.
# The footprint is TE's DT13-2P layout; check a sample's holes and cavity numbers before use.
