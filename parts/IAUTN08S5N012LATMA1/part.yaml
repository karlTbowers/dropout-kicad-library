# Infineon IAUTN08S5N012L data sheet Rev. 1.0 (2024-02-28). Node60 power entry, selected 2026-10-22.
# A DUAL-GATE part: a linear FET (LINFET) and a low-RDS(on) FET (ONFET) share drain and source
# (p. 1: "Gate ON pin 1, Gate LIN pin 2, Source pin 3-8, Drain Tab"). The 1.15 mOhm max RDS(on) needs
# both gates at 10 V (p. 4); the LINFET alone is 9.0 mOhm max. Drawn as two N-MOSFETs in parallel.
# Not pin-compatible with single-gate TOLL parts (AOTL66810Q, TSM018NM08TL): pin 2 is a gate here
# and a source pin there. Tab = pad 9 (Infineon gives it no number). Gate pins are inputs; drain and
# source passive, as KiCad's stock Q_NMOS.
# Orderable code: IAUTN08S5N012LATMA1 is the only one at DigiKey, Mouser and Newark (2026-10-22).
