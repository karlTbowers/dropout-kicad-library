  Description: Analog Devices (Maxim) MAX20004E 3.5 to 36 V 4 A synchronous step-down converter, fixed 5 V (FB to BIAS) or adjustable 1 to 5 V, 2.1 MHz, 15 µA skip-mode Iq, RESET output, spread spectrum, AEC-Q100, FC2QFN-17 3.5x3.75 mm
  ki_keywords: buck step-down regulator converter DC-DC automotive 36V low-Iq reset
