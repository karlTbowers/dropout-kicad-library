  Description: MPS MPQ2143 2.5 to 5.5 V 3 A synchronous step-down converter, COT, 1.2 MHz, adjustable from 0.6 V, 40 µA Iq, power good, AEC-Q100 Grade 1, TSOT-23-8 (not for new designs)
  ki_keywords: buck step-down regulator converter DC-DC automotive low-voltage power-good COT
