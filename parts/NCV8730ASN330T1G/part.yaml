# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/NCV8730ASN330T1G/part.yaml
# Pins from NCV8730 datasheet Rev. 8 (Dec. 2025) pin description tables (p. 3); ordering information
# p. 29. The 3.3 V automotive (NCV) codes are NCV8730BMTW330TBG (WDFNW6, with PG) and
# NCV8730ASN330T1G (TSOP-5, without PG); no other 3.3 V NCV8730 code is listed. IN is on the left
# (KLC S4.2). EN has an internal 0.3 uA (0.01-1.0) pull-up and "if connected to IN or left
# unconnected the device is enabled"; EN may go to VIN + 0.3 V; EN leakage at 30 V +/-1 uA max.
# Iq (IOUT = 0, VIN = VOUT + 1 V to 38 V, TJ -40 to 125 C): version A 1.3 typ / 2.5 max uA,
# version B 1.8 typ / 3.0 max uA; shutdown 0.35 / 1.5 uA (includes the EN pull-up). Electrical
# limits are specified to TJ 125 C (abs. max TJ 150 C); VIN abs. max 40 V, operating 38 V.
# The fixed-voltage NC pins are "not internally connected; can be tied to the ground plane": typed
# no_connect per the DropOut NC rule, so tying them to GND needs an ERC exclusion.
# Version A (no PG): pin 4 is NC. Node60 always-on LDO: candidate (the other 3.3 V NCV8730
# code), not selected.
