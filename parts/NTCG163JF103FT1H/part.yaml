# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/NTCG163JF103FT1H/part.yaml
# TDK NTCG163JF103FT1H data sheet (product.tdk.com) and the automotive NTCG catalog (20260731) pp. 9-10:
# 10 kOhm +/-1 % at 25 C, B25/85 3435 K +/-1 % (B25/50 3380, B25/75 3422, B25/100 3453 K typ.),
# -40 to +175 C, 100 mW, 1 mW/C, 0.31 mA permissible, automotive grade AEC-Q200. Land pattern:
# catalog p. 13, 1608 (A/B/C 0.60-0.80; product page 0.7 +/-0.1). Pins as KiCad's
# Device:Thermistor_NTC.
# R-T data for firmware: TDK RT sheet (1 C steps, Rmin/Rnom/Rmax, B25/T, dT), archived in
# dropout-vendor-docs.
# 175 C version (catalog p. 10: "solder joint is not guaranteed, it is guaranteed as a single
# part"). Mouser lists it as factory special order (2026-10-22); DigiKey does not carry it.
# Node60 temperature sensing: TDK version, built per the build-all-versions rule.
library: DropOut_Thermistor
name: NTCG163JF103FT1H
style: thermistor_ntc
pins: pins.csv
fields:
  Reference: RT
  Value: NTCG163JF103FT1H
  Footprint: DropOut_Resistor_SMD:R_0603_1608Metric_Pad0.7x0.7mm
  Datasheet: https://product.tdk.com/system/files/dam/doc/product/sensor/ntc/chip-ntc-thermistor/data_sheet/datasheet_ntcg163jf103ft1h.pdf
  Description: TDK NTCG NTC thermistor 10 kΩ ±1 %, B25/85 3435 K ±1 % (B25/50 3380 K), -40 to +175 °C, automotive (AEC-Q200), 0603 (1608 metric)
  ki_keywords: thermistor NTC temperature sensor 10k automotive
  ki_fp_filters: R?0603?1608Metric*
  Manufacturer: TDK
  MPN: NTCG163JF103FT1H
  DigiKey_PN: "-"
  Mouser_PN: "810-NTCG163JF103FT1H"
  Temperature_Grade: AEC-Q200, -40 to +175 °C
  Notes: R-T table in TDK's RT sheet https://product.tdk.com/system/files/dam/doc/product/sensor/ntc/chip-ntc-thermistor/rt_sheets/ntcg163jf103ft1h.csv
