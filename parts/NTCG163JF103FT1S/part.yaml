# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/NTCG163JF103FT1S/part.yaml
# TDK NTCG163JF103FT1S data sheet (product.tdk.com) and the automotive NTCG catalog (20260731) pp. 9-10:
# 10 kOhm +/-1 % at 25 C, B25/85 3435 K +/-1 % (B25/50 3380, B25/75 3422, B25/100 3453 K typ.),
# -40 to +150 C, 100 mW, 1 mW/C, 0.31 mA permissible, automotive grade AEC-Q200. Land pattern:
# catalog p. 13, 1608 (A/B/C 0.60-0.80; product page 0.7 +/-0.1). Pins as KiCad's
# Device:Thermistor_NTC.
# R-T data for firmware: TDK RT sheet (1 C steps, Rmin/Rnom/Rmax, B25/T, dT), archived in
# dropout-vendor-docs.
# 150 C version of NTCG163JF103FTDS (same R-T curve). Node60 temperature sensing: TDK version
# that meets the 150 C requirement (min. -40 C, not -55 C).
library: DropOut_Thermistor
name: NTCG163JF103FT1S
style: thermistor_ntc
pins: pins.csv
fields:
  Reference: RT
  Value: NTCG163JF103FT1S
  Footprint: DropOut_Resistor_SMD:R_0603_1608Metric_Pad0.7x0.7mm
  Datasheet: https://product.tdk.com/system/files/dam/doc/product/sensor/ntc/chip-ntc-thermistor/data_sheet/datasheet_ntcg163jf103ft1s.pdf
  Description: TDK NTCG NTC thermistor 10 kΩ ±1 %, B25/85 3435 K ±1 % (B25/50 3380 K), -40 to +150 °C, automotive (AEC-Q200), 0603 (1608 metric)
  ki_keywords: thermistor NTC temperature sensor 10k automotive
  ki_fp_filters: R?0603?1608Metric*
  Manufacturer: TDK
  MPN: NTCG163JF103FT1S
  DigiKey_PN: "445-6881-1-ND"
  Mouser_PN: "810-NTCG163JF103FT1S"
  Temperature_Grade: AEC-Q200, -40 to +150 °C
  Notes: R-T table in TDK's RT sheet https://product.tdk.com/system/files/dam/doc/product/sensor/ntc/chip-ntc-thermistor/rt_sheets/ntcg163jf103ft1s.csv
