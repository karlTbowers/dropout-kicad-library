  Description: Vishay NTCS0603E3 NTC thermistor 10 kΩ ±1 %, B25/85 3610 K ±1 %, -55 to +150 °C, AEC-Q200, glass protected, 0603 (1608 metric)
  ki_keywords: thermistor NTC temperature sensor 10k automotive
  ki_fp_filters: R?0603?1608Metric*
  Manufacturer: Vishay BCcomponents
  MPN: NTCS0603E3103FMT
  DigiKey_PN: BC2472CT-ND
  Mouser_PN: 594-NTCS0603E3103FMT
  Temperature_Grade: AEC-Q200, -55 to +150 °C
