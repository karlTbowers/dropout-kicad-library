  Description: Amphenol RADLOK 5.7 mm RADSOK right-angle plug, 90 A, 1000 V, tubular crimp lug for 16 mm² cable, red, -40 to +125 °C
  ki_keywords: RADLOK RADSOK power connector plug right angle cable crimp 16mm2 high current
