# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/RL00571-25RE/part.yaml
# Amphenol Technical Products International RADLOK RL00571-25RE: 5.7 mm RADLOK right-angle cable plug (RADSOK socket),
# tubular crimp lug for 25 mm² cable, red. Code (customer drawing "RADLOK Connector Tubular Lug Version" rev. H (2021-01-19), and rev. L (2024-02-20), same 5.7 mm rows): RL 0 = RADLOK connector, 057 = 5.7 mm,
# 1 = tubular lug, 25 = 25 mm² cable, colour RE = red (data sheet IDS-67-1: blank orange, BK black, RE red).
# Drawing, 5.7 mm row: 120 A (Ø7.2 bore, Ø9.5 barrel, tubular drawing D1/D2); 18.5 wide, 33.0 to the collar, 23.8 high, Ø11.5 boss 9.4 long, 47.7 overall, tubular barrel 19.0 long. Data sheet IDS-67-1: 1000 V, -40 to +125 °C,
# 500 mating cycles, red release clip. Archived in dropout-vendor-docs Amphenol-TPI/RADLOK/. Same plug in the other colours: RL00571-25, RL00571-25BK.
# A cable part: no footprint, on_board: false and in_pos_files: false, as the RL9057-101-F1x receptacles it mates.
# One electrical contact: one passive pin, as the receptacle symbol.
# Datasheet: Amphenol Tuchel Industrial's product drawing for this part (customer drawing rev. L, 2024-02-20).
# 3D model: generators/custom/Amphenol_RADLOK_5.7mm.py, from the customer drawing and measurements of Amphenol
# Tuchel's customer STEP c3d-rl00571-25or-01-000.stp (no licence stated, so not redistributed); estimates marked there. Drawn mated
# in the feed-through model's frame.
# Observed 2026-11-01: DigiKey 298 in stock, Mouser 812 in stock. Active.
