  Description: Amphenol RADLOK 5.7 mm RADSOK feed-through receptacle, 120 A, 1000 V, M6 threaded stud, square flange panel mount (4 × M4), black, -40 to +125 °C
  ki_keywords: RADLOK RADSOK power connector receptacle feedthrough panel flange threaded stud M6 high current
