# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/RL9057-101-F1/part.yaml
# Amphenol Technical Products International RADLOK RL9057-101-F1: 5.7 mm RADLOK feed-through ("Feed Thru Pin To Thread"),
# RADSOK pin in front, M6 x 1.0-6g stud behind, silver plating (101), square flange with seal, black housing.
# Code (customer drawing rev. H, 2018-01-11, and rev. K, 2022-04-25, same 5.7 mm row; catalogue p. 27): RL 9 = RADLOK pin, 057 = 5.7 mm, 10X = pin to thread with plating X
# (1 silver), F1 = feed thru. No colour suffix = black (catalogue ordering information: "Blank: Black, OR: Orange, RE: Red"; amphenol-industrial.de lists it as RL9057-101-F1 on its F1BK page).
# Drawing, 5.7 mm row: 120 A, 25.0 square flange, 4 × M4 screws on 17.0 (drawing P; M3 is the 3.6 mm size only), Ø14.7 panel hole with two 2.8 key notches
# 18.2 across, 3 mm max. panel, 49.6 overall, stud 10 long, 4.0 ± 0.4 N·m. Data sheet IDS-67-1: 1000 V,
# -40 to +125 °C, 500 mating cycles. Archived in dropout-vendor-docs Amphenol-TPI/RADLOK/. Same part in the other
# colours: RL9057-101-F1OR, RL9057-101-F1RE. The bare pin RL9057-101 was not built (user's choice, 2026-11-01).
# No footprint (user's decision 2026-10-28, as SurLok Plus SLPRATPSx): the receptacle mounts on the enclosure wall and
# its M6 stud screws into a Würth REDCUBE 74660016 on the board, placed as its own part. on_board: false, in_pos_files: false.
# One electrical contact: one passive pin, as the REDCUBE symbol.
# Datasheet: Amphenol Tuchel Industrial's product drawing for this part (customer drawing rev. K, 2022-04-25).
# 3D model: generators/custom/Amphenol_RADLOK_5.7mm.py, from the customer drawing and measurements of Amphenol
# Tuchel's customer STEP c3d-rl9057-101-f1bk-01-000.stp (no licence stated, so not redistributed); estimates marked there.
# Observed 2026-11-01: DigiKey 165 in stock, Mouser 804. Active.
