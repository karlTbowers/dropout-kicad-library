# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/RL9057-101-F1OR/part.yaml
# Amphenol Technical Products International RADLOK RL9057-101-F1OR: 5.7 mm RADLOK feed-through ("Feed Thru Pin To Thread"),
# RADSOK pin in front, M6 x 1.0-6g stud behind, silver plating (101), square flange with seal, orange housing.
# Code (customer drawing rev. H, 2018-01-11): RL 9 = RADLOK pin, 057 = 5.7 mm, 10X = pin to thread with plating X
# (1 silver), F1 = feed thru. OR = orange (DigiKey colour parameter).
# Drawing, 5.7 mm row: 120 A, 25.0 square flange, 4 × M3 screws on 17.0, Ø14.7 panel hole with two 2.8 key notches
# 18.2 across, 3 mm max. panel, 49.6 overall, stud 10 long, 4.0 ± 0.4 N·m. Data sheet IDS-67-1: 1000 V,
# -40 to +125 °C, 500 mating cycles. Archived in dropout-vendor-docs Amphenol-TPI/RADLOK/. Same part in the other
# colours: RL9057-101-F1, RL9057-101-F1RE. The bare pin RL9057-101 was not built (user's choice, 2026-11-01).
# No footprint (user's decision 2026-10-28, as SurLok Plus SLPRATPSx): the receptacle mounts on the enclosure wall and
# its M6 stud screws into a Würth REDCUBE 74660016 on the board, placed as its own part. on_board: false, in_pos_files: false.
# One electrical contact: one passive pin, as the REDCUBE symbol.
# Datasheet: no Amphenol-hosted RADLOK document exists (amphenol-industrial.com has no RADLOK page, 2026-11-01); the field
# links Amphenol TPI's unmodified customer drawing at the address DigiKey publishes it.
# 3D model: generators/custom/Amphenol_RADLOK_5.7mm.py, from the customer drawing; estimates marked there.
# Observed 2026-11-01: DigiKey and Mouser none in stock. Active.
