# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/SLPRATPSO/part.yaml
# Amphenol Industrial Operations SurLok Plus SLPRATPSO: Gen 1.0 (1000 V DC) 5.7 mm RADSOK receptacle without keyway,
# threaded termination (M6 stud), flange panel mount, IP67 sealed, orange. Code (catalog IC-10, 23 Oct 2025, p. 6):
# SLP series, R receptacle w/o keyway, A 5.7 mm 120 A, T threaded, P with flange, S IP67, O orange, no keyway digit.
# Catalog p. 5: 100-120 A, 1000 V DC, -40 to +105 °C (1000 V DC version), UL 94 V-0, >= 100 cycles; p. 13: panel
# cutout Ø14.3 with 4 × M4 screws on 18 × 18 (0.8 N·m), M6 nut 3 N·m. Drawing C10-730187 rev. F: Ø14.20 +0.20/0 cutout,
# Ø4.20 holes or M4 screws on 18 × 18, 13.50 front face to flange, 3.0 flange, 1.0 gasket, Ø14 rear body, stud 10.70 REF. Archived in dropout-vendor-docs
# Amphenol-Industrial/SurLok-Plus/. Same receptacle in the other colours: SLPRATPSB, SLPRATPSR.
# No footprint (user's decision 2026-10-28): the receptacle mounts on the enclosure wall and its M6 stud screws
# into a Würth REDCUBE 74660016 on the board, which is placed as its own part. The symbol is on_board: false
# (BOM only, never sent to the PCB) and in_pos_files: false.
# One electrical contact: one passive pin, as the REDCUBE symbol.
# 3D model: generators/custom/Amphenol_SurLok-Plus_SLPRAT.py, rebuilt 2026-11-02 from Amphenol's customer drawing
# C10-730187 rev. F (screw type; stamped "controlled document", so archived but not linked) and measurements of
# Amphenol's customer STEP c3d-slpratpsb-01-000.stp (no licence stated, not redistributed), both from the SLPRATPSB
# page on amphenol-industrial.de (Amphenol Tuchel). The first model was estimated from catalog photos.
# Observed 2026-10-28: DigiKey none in stock, Mouser 167; Newark carries it. Active.
library: DropOut_Connector
name: SLPRATPSO
pins: pins.csv
on_board: false
in_pos_files: false
fields:
  Reference: J
  Value: SLPRATPSO
  Footprint: ""
  Datasheet: https://amphenol-industrial.com/wp-content/uploads/amphenol/surlok-plus-series-ic-10.pdf
  Description: Amphenol SurLok Plus 5.7 mm RADSOK receptacle, 120 A, 1000 V DC, M6 threaded stud, square flange panel mount (4 × M4), IP67, orange, no keyway, -40 to +105 °C
  ki_keywords: SurLok Plus RADSOK power connector receptacle panel flange threaded stud M6 high current
  Manufacturer: Amphenol Industrial Operations
  MPN: SLPRATPSO
  DigiKey_PN: 965-SLPRATPSO-ND
  Mouser_PN: 654-SLPRATPSO
  Temperature_Grade: -40 to +105 °C
  Notes: "Panel mount, not placed on the PCB (no footprint): the M6 stud screws into a Würth REDCUBE 74660016 on the board, placed as its own part. Panel: Ø14.20 +0.20/0 cutout, 4 × M4 on 18 × 18 (drawing C10-730187 rev. F; catalog p. 13). 3D model ${KIPRJMOD}/lib/dropout-kicad-library/3dmodels/DropOut_Connector_Amphenol.3dshapes/Amphenol_SurLok-Plus_SLPRATPSO.step (from Amphenol's drawing and STEP): add it to the 74660016 footprint with offset z = -2.6 mm. Mates 5.7 mm SurLok Plus plugs without keyway (SLPPA…, SLPIPA…)."
catalog:
  family: power-connectors
  group: Amphenol SurLok Plus 5.7 mm
  attributes:
    Type: Receptacle
    Colour: Orange
    Current: 120 A
    Voltage: 1000 V DC
    Termination: M6 threaded stud
    Mounting: Square flange panel mount, 4 × M4
    Sealing: IP67
    Keyway: None
  mates_with: [SLPPA25BSB, SLPPA25BSR]
