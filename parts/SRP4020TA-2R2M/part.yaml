  Value: SRP4020TA-2R2M
  Footprint: DropOut_Inductor_SMD:L_Bourns_SRP4020TA
  Datasheet: "https://www.bourns.com/docs/Product-Datasheets/SRP4020TA.pdf"
  Description: Bourns SRP4020TA power inductor, 2.2 µH ±20 %, Isat 6.0 A (-20 %), Irms 4.0 A (40 °C rise), DCR 61 mΩ max, carbonyl powder core, shielded, wound, AEC-Q200, 4.45x4.06x2.0 mm
  ki_keywords: inductor choke coil power buck shielded automotive AEC-Q200
  ki_fp_filters: L*Bourns*SRP4020TA*
