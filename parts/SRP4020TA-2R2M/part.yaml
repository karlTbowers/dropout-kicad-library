# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/SRP4020TA-2R2M/part.yaml
# Bourns SRP4020TA data sheet (PDF dated 2020-07-16) p. 1. Two-terminal inductor, no polarity (pins 1/2 = footprint pads 1/2).
# Node60 LMQ66430MC3RXBRQ1 buck inductor search (2.2 MHz, 3 A; Isat >= 5 A = IPEAKMAX max, Irms >= 3 A; SNVSBV1F §8.2.1.2.3).
# Rejected for Node60: carbonyl powder core; TI SNVSBV1F §8.2.1.2.3 warns of powder-core losses above about 1 MHz, and Bourns gives no 2.2 MHz loss data. Kept as a stocked fallback.
library: DropOut_Inductor
name: SRP4020TA-2R2M
style: inductor
pins: pins.csv
fields:
