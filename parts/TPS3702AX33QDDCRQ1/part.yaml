# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/TPS3702AX33QDDCRQ1/part.yaml
# Pins from TPS3702-Q1 datasheet SBVS261C Table 4-1 (same for every version; the pin table lives in
# parts/TPS3702AX33QDDCRQ1/pins.csv). OV and UV are active-low open-drain outputs. Naming (Table 8-1): "A" =
# window ±2% (SET high) or ±6% (SET low) of the nominal, "X" = 0.55% hysteresis, "33" = 3.3 V, Q = automotive, DDC = SOT-23
# 6-pin, R = reel. One of two 3.3 V automotive versions built per the build-all-versions rule;
# the other is TPS3702CX33QDDCRQ1.
