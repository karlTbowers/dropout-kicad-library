# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/TPS628122GQWRWYRQ1/part.yaml
# Pins from TPS6281x-Q1 datasheet SLVSDU1K (August 2018, revised July 2025) Table 5-1 and Figure 5-1. Types: EN,
# MODE/SYNC, COMP/FSET, SS/TR and FB are inputs (Table 5-1 "I"); EN, MODE/SYNC and COMP/FSET must not be left
# unconnected (COMP/FSET tied to GND or VIN sets 2.25 MHz). FB: on this fixed-voltage version, connect it directly to
# the output; typed input like the other DropOut bucks, so the output net needs a PWR_FLAG. SW (no type in Table 5-1)
# drives the inductor: power_out. PG is open drain ("can be left open or tied to GND when not used"). VIN on the left
# (KLC S4.2). No exposed pad: GND is pin 4.
# Device Comparison Table (Section 4) and Package Option Addendum: TPS628122GQWRWYRQ1 = 2 A, output discharge ON,
# foldback current limit OFF, spread spectrum clocking ON, fixed 1.5 V output; RWY (VQFN-HR 9, 3 x 2 mm, wettable
# flanks: drawing RWY0009C), AEC-Q100 Grade 1, TA -40 to +125 C, MSL 2 260 C, marking 8122GQ, 3000 per reel.
# Input 2.75 to 6 V, Iq 15 uA typ (p. 1, 6.5).
# Node60 1V5_CORE buck part search (2026-11-02): NOT CHOSEN. DigiKey sells it only on full reels (3000, Tape & Reel;
# no cut tape, 2026-11-02), and the VQFN-HR package (bar and L-shaped lands, no leads to inspect) is harder to
# assemble and rework than the selected TPS628502QDRLRQ1's SOT-583.
