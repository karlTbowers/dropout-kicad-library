# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/TPS7B8133QDRVRQ1/part.yaml
# Pins from TPS7B81-Q1 datasheet SBVS370F (Sept 2025) Table 4-1. Orderable codes from the Package
# Option Addendum (p. 22): TPS7B8133 = fixed 3.3 V, Q = automotive (AEC-Q100 Grade 1, TA -40 to
# +125 C, TJ -40 to +150 C), R = reel. IN is on the left (KLC S4.2). EN is high-voltage tolerant
# (abs. max VIN) with no internal pull: tie it to IN for always-on use ("connect to the IN pin for
# self-bias applications", 6.3.1); VIH 2 V, IEN 10 nA typ. Iq (EN >= 2 V, VIN 6-40 V, TJ -40 to
# 150 C): 1.9 typ / 3.5 max uA at IOUT = 0; 2.7 typ / 4.5 max uA at 0.2 mA (DRV, KVU), 6.5 max uA
# (DGN); shutdown 0.3 / 1 uA. DNC: "do not connect to a biased voltage; tie to ground or leave
# floating": typed no_connect so ERC flags a wire, leave it open. The thermal pad is not a
# numbered pin in Table 4-1; TI numbers it on the package drawing; tie it to GND.
# QDRVRQ1 = DRV0006A WSON 2x2 without wettable flanks (NiPdAu, MSL 2). Also used by
# TPS7B8133QWDRVRQ1. Node60 always-on LDO: alternate version.
