# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/WSK1216L3000FEA/part.yaml
# Vishay WSK1216 data sheet (doc 30189, revision 14-Sep-2026). Node60 4-terminal (Kelvin) shunt search
# (2026-10-22): a standard-value neighbour of the 0.25 mΩ WSK1216L2500FEA, built for a later revision
# (user's request, 2026-10-23); using it means rescaling the LM74910H and INA228 thresholds.
# p. 1-2: 0.3 mΩ, 1 %, 8 W at 70 °C terminal temperature, component TCR ±35 ppm/°C, MnCuSn element,
# thermal resistance 6.8 °C/W, -65 to +170 °C, AEC-Q200. Code: WSK1216 + L3000 + F (1 %) + EA (tape and
# reel); EB (1000-piece reel) is non-standard and not listed by any distributor (2026-10-22).
# Pins as KiCad's Device:R_Shunt: 1 and 4 force, 2 and 3 sense, 2 on pin 1's terminal.
