# Symbol definition for scripts/symbolgen.py. Regenerate with:
#   python3 scripts/symbolgen.py parts/XLD8A24CAHM3_A_I/part.yaml
# Vishay XLD8A24CA datasheet (doc 87200, rev. 23-Jan-2026): bidirectional XClampR TVS, DO-218AC,
# lead 1 = small lead (pad 1), lead 2 = metal heatsink (pad 2); no polarity. Pins A1/A2 as
# KiCad's Device:D_TVS. Ordering code from the datasheet: XLD8A24CAHM3_A/I (AEC-Q101, "I" =
# 13" tape and reel). Symbol name and Value replace "/" with "_" (KLC S6.2: Value = name; KiCad
# symbol names cannot contain "/"); the MPN field keeps the exact code.
library: DropOut_Protection
name: XLD8A24CAHM3_A_I
