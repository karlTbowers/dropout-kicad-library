# Chip resistors and MLCCs: one row per orderable MPN. scripts/passivegen.py turns each row into
# parts/<MPN>/part.yaml + pins.csv and builds its symbol; edit this file, never the generated files.
#
# families: what an ordering-code family has in common (manufacturer, datasheet, construction,
#   temperature range). `datasheet: per part` takes each row's own `datasheet`.
# parts: mpn, family, value (handbook D-45 short form: 10k, 49.9R, 0R, 100nF, 4.7uF), size (EIA),
#   ratings (tolerance, voltage, power, tcr for resistors; voltage, tolerance, dielectric for MLCCs;
#   current for 0R jumpers), digikey/mouser product numbers ("-" = not stocked), line (the part-search
#   line the part was chosen for), notes (become the Notes field), observed (dated stock and price).
#
# Selection (Node60 schematic passives, 2026-10-22/23): AEC-Q200, rated to +125 °C or more, two or
# more manufacturers per line where AEC-Q200 parts exist; every candidate is built, rejected ones too.
families:
  yageo_ac:
    kind: R
    manufacturer: Yageo
    series: AC
    construction: thick film
    grade: AEC-Q200
    temperature: -55 to +155 °C
    datasheet: https://yageogroup.com/content/datasheet/asset/file/PYU-AC_51_ROHS_L
    source: Yageo AC series product specification PYu-AC_51 V.11 (17 Nov 2023), Table 1 dimensions, Table 2 ratings
